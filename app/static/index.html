<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Portal Antecipe</title>
  <link href="/static/css/tailwind.css?v=20261024perf" rel="stylesheet" />
</head>
<body class="portal-app portal-screen-home min-h-screen text-slate-900 antialiased">
  <div class="portal-app-bg" aria-hidden="true"></div>
  <div class="cinematic-progress" aria-hidden="true"></div>
  <div id="lang-switcher-root" class="portal-lang-switch-root"></div>

  <main class="cinematic-main">
    <!-- Tela 1: título + upload -->
    <section id="portal-home" class="portal-home" aria-label="Início">
      <div class="portal-home__inner mx-auto w-full max-w-lg px-4">
        <div class="portal-home__brand">
          <img
            class="portal-home__logo"
            src="/static/img/brand/logo-reduzida.svg"
            alt=""
            width="80"
            height="110"
            decoding="async"
          />
          <h1 class="portal-home__title" id="portal-home-title">Portal Antecipe</h1>
        </div>
        <div id="upload-root" class="portal-home__upload"></div>
        <div id="status" class="portal-home__status empty:hidden" role="status" aria-live="polite"></div>
      </div>
    </section>

    <!-- Tela 2: dashboard + tabela -->
    <section id="portal-results" class="portal-results" aria-hidden="true" aria-label="Resultados">
      <header class="portal-results-header">
        <div class="portal-results-header__inner portal-results__inset mx-auto w-full max-w-screen-2xl">
          <button type="button" id="btn-novo-lote" class="portal-results-header__back"></button>
          <div class="portal-results-header__brand">
            <img
              src="/static/img/brand/logo-reduzida.svg"
              alt=""
              width="22"
              height="30"
              decoding="async"
            />
            <span class="portal-results-header__title" id="portal-results-title">Portal Antecipe</span>
          </div>
        </div>
      </header>
      <div class="portal-results__body portal-results__inset mx-auto w-full max-w-screen-2xl pb-3">
        <div class="grid grid-cols-12 gap-x-0">
          <div class="portal-results-column col-span-12">
            <div id="results-panel" class="portal-results-panel">
              <section
                id="dashboard-root"
                class="dashboard-resumo panel panel--full-bleed-mobile cinematic-scene cinematic-reveal"
                aria-live="polite"
              ></section>
              <div
                id="table-root"
                class="panel panel--full-bleed-mobile hidden"
                hidden
              ></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <link href="/static/css/main.css?v=20261024ad" rel="stylesheet" />
  <script type="module" src="/static/js/main.js?v=20261024ad"></script>
</body>
</html>
