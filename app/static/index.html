<body class="min-h-screen bg-gradient-to-b from-slate-50 to-slate-100 text-slate-900 antialiased">
  <div class="mx-auto w-full max-w-screen-2xl px-0 py-6 lg:px-8 lg:py-8 xl:px-10">
    <div class="grid grid-cols-12 gap-x-0 lg:gap-x-6">
      <div class="col-span-12 lg:col-span-8 lg:col-start-3">
        <div class="px-4 lg:px-0">
          <header class="mb-8">
            <p class="text-sm font-medium uppercase tracking-wide text-indigo-600">Hackathon Antecipe</p>
            <h1 class="mt-1 text-2xl font-bold tracking-tight sm:text-3xl">Portal Antecipe</h1>
            <p class="mt-2 text-slate-600">Envie um CSV de recebíveis para validação.</p>
          </header>

          <div id="upload-root"></div>
          <div id="status" class="mt-4 empty:hidden" role="status" aria-live="polite"></div>
        </div>

        <div id="summary-root" class="panel panel--full-bleed-mobile mt-4 hidden"></div>
        <div id="table-root" class="panel panel--full-bleed-mobile mt-4 hidden"></div>
      </div>
    </div>
  </div>

  <!-- Depois do Tailwind CDN para não perder estilos de componentes (badges, panel) -->
