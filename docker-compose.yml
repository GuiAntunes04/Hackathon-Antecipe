services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: antecipe
      POSTGRES_PASSWORD: senha_ficticia_exemplo
      POSTGRES_DB: antecipe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antecipe -d antecipe"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://antecipe:senha_ficticia_exemplo@db:5432/antecipe
      CAMINHO_GABARITO: resultado_esperado_100k.json
      CAMINHO_SITUACAO: cnpj_situacao_mock.csv
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data

volumes:
  postgres_data:
